<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Space Engine</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #040510;
      --panel: rgba(10, 16, 35, 0.72);
      --panel-border: rgba(115, 154, 255, 0.35);
      --text: #d9ecff;
      --accent: #87e5ff;
      --muted: #93a0c9;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #091229 0%, #040510 45%, #020208 100%);
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 350px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      line-height: 1.38;
      pointer-events: none;
    }

    .hud h1 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0;
    }

    .value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .legend {
      margin-top: 8px;
      font-size: 11px;
      color: #aac0ee;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="hud">
    <h1>Universe Engine</h1>
    <div class="row"><span>Current speed</span><span class="value" id="speed">1 m/s</span></div>
    <div class="row"><span>Loaded sectors</span><span class="value" id="chunks">0</span></div>
    <div class="row"><span>Visible stars</span><span class="value" id="stars">0</span></div>
    <div class="row"><span>Visible nebulas</span><span class="value" id="nebulas">0</span></div>
    <div class="legend">
      WASD move • Arrow keys look (yaw/pitch) • Z/X speed −/+ • C reset speed
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d', { alpha: false });
      const speedEl = document.getElementById('speed');
      const chunksEl = document.getElementById('chunks');
      const starsEl = document.getElementById('stars');
      const nebulasEl = document.getElementById('nebulas');

      const CHUNK_SIZE = 2200;
      const LOAD_RADIUS = 2;
      const STAR_BASE_DENSITY = 38;
      const NEBULA_BASE_DENSITY = 2;
      const MAX_DRAW_DISTANCE = CHUNK_SIZE * (LOAD_RADIUS + 1.45);
      const FOV = Math.PI / 3.0;

      const SPEED_STEPS = [
        { label: '1 m/s', mps: 1 },
        { label: '10 m/s', mps: 10 },
        { label: '100 m/s', mps: 100 },
        { label: '1 km/s', mps: 1e3 },
        { label: '10 km/s', mps: 1e4 },
        { label: '100 km/s', mps: 1e5 },
        { label: '1 Mm/s', mps: 1e6 },
        { label: '10 Mm/s', mps: 1e7 },
        { label: '100 Mm/s', mps: 1e8 },
        { label: '1 Gm/s', mps: 1e9 },
        { label: '1 AU/s', mps: 1.495978707e11 },
        { label: '1 ly/s', mps: 9.4607e15 },
        { label: '1 kly/s', mps: 9.4607e18 },
        { label: '1 Mly/s', mps: 9.4607e21 },
        { label: '10 Mly/s', mps: 9.4607e22 }
      ];

      const STAR_TYPES = [
        { name: 'Red Dwarf', color: '#ff7f7f', size: [0.7, 1.35], glow: [2, 4] },
        { name: 'Yellow Main Sequence', color: '#ffe7a3', size: [0.9, 1.8], glow: [3, 6] },
        { name: 'Blue Giant', color: '#9ed5ff', size: [1.4, 2.6], glow: [5, 8] },
        { name: 'White Dwarf', color: '#eef6ff', size: [0.65, 1.25], glow: [2, 4] },
        { name: 'Orange Giant', color: '#ffc28e', size: [1.2, 2.2], glow: [4, 7] },
        { name: 'Neutron Star', color: '#cab5ff', size: [0.55, 1.05], glow: [2, 5] }
      ];

      const NEBULA_TYPES = [
        { color: '120,180,255', radius: [200, 480], alpha: [0.04, 0.12] },
        { color: '255,120,220', radius: [180, 440], alpha: [0.04, 0.11] },
        { color: '130,255,180', radius: [220, 520], alpha: [0.03, 0.10] },
        { color: '255,200,100', radius: [190, 420], alpha: [0.03, 0.09] }
      ];

      const keys = new Set();
      let speedIndex = 0;

      const camera = {
        x: 0,
        y: 0,
        z: 0,
        yaw: 0,
        pitch: 0
      };

      const world = {
        chunks: new Map()
      };

      const state = {
        width: 1,
        height: 1,
        halfW: 0.5,
        halfH: 0.5,
        focalLength: 1
      };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = Math.floor(window.innerWidth * dpr);
        state.height = Math.floor(window.innerHeight * dpr);
        canvas.width = state.width;
        canvas.height = state.height;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        state.halfW = state.width * 0.5;
        state.halfH = state.height * 0.5;
        state.focalLength = state.halfW / Math.tan(FOV * 0.5);
      }

      function hash32(x, y, z) {
        let h = Math.imul(x, 0x8da6b343) ^ Math.imul(y, 0xd8163841) ^ Math.imul(z, 0xcb1ab31f);
        h ^= h >>> 16;
        h = Math.imul(h, 0x7feb352d);
        h ^= h >>> 15;
        h = Math.imul(h, 0x846ca68b);
        h ^= h >>> 16;
        return h >>> 0;
      }

      function makeRng(seed) {
        let s = seed >>> 0;
        return () => {
          s += 0x6d2b79f5;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function pickRange(rng, min, max) {
        return min + (max - min) * rng();
      }

      function generateChunk(cx, cy, cz) {
        const seed = hash32(cx, cy, cz);
        const rng = makeRng(seed);
        const baseX = cx * CHUNK_SIZE;
        const baseY = cy * CHUNK_SIZE;
        const baseZ = cz * CHUNK_SIZE;

        const stars = [];
        const nebulas = [];

        const starCount = STAR_BASE_DENSITY + Math.floor(rng() * STAR_BASE_DENSITY * 1.1);
        const nebulaCount = NEBULA_BASE_DENSITY + Math.floor(rng() * 2);

        for (let i = 0; i < starCount; i++) {
          const t = STAR_TYPES[Math.floor(rng() * STAR_TYPES.length)];
          stars.push({
            x: baseX + rng() * CHUNK_SIZE,
            y: baseY + rng() * CHUNK_SIZE,
            z: baseZ + rng() * CHUNK_SIZE,
            color: t.color,
            size: pickRange(rng, t.size[0], t.size[1]),
            glow: pickRange(rng, t.glow[0], t.glow[1]),
            twinklePhase: rng() * Math.PI * 2,
            twinkleRate: pickRange(rng, 0.5, 1.8)
          });
        }

        for (let i = 0; i < nebulaCount; i++) {
          const t = NEBULA_TYPES[Math.floor(rng() * NEBULA_TYPES.length)];
          nebulas.push({
            x: baseX + rng() * CHUNK_SIZE,
            y: baseY + rng() * CHUNK_SIZE,
            z: baseZ + rng() * CHUNK_SIZE,
            color: t.color,
            radius: pickRange(rng, t.radius[0], t.radius[1]),
            alpha: pickRange(rng, t.alpha[0], t.alpha[1])
          });
        }

        return { stars, nebulas };
      }

      function chunkKey(x, y, z) {
        return `${x},${y},${z}`;
      }

      function updateChunks() {
        const cx = Math.floor(camera.x / CHUNK_SIZE);
        const cy = Math.floor(camera.y / CHUNK_SIZE);
        const cz = Math.floor(camera.z / CHUNK_SIZE);

        const needed = new Set();

        for (let x = cx - LOAD_RADIUS; x <= cx + LOAD_RADIUS; x++) {
          for (let y = cy - LOAD_RADIUS; y <= cy + LOAD_RADIUS; y++) {
            for (let z = cz - LOAD_RADIUS; z <= cz + LOAD_RADIUS; z++) {
              const key = chunkKey(x, y, z);
              needed.add(key);
              if (!world.chunks.has(key)) {
                world.chunks.set(key, generateChunk(x, y, z));
              }
            }
          }
        }

        for (const key of world.chunks.keys()) {
          if (!needed.has(key)) {
            world.chunks.delete(key);
          }
        }
      }

      function getBasis() {
        const cp = Math.cos(camera.pitch);
        const sp = Math.sin(camera.pitch);
        const cy = Math.cos(camera.yaw);
        const sy = Math.sin(camera.yaw);

        const forward = { x: sy * cp, y: sp, z: cy * cp };
        const right = { x: cy, y: 0, z: -sy };
        const up = {
          x: right.y * forward.z - right.z * forward.y,
          y: right.z * forward.x - right.x * forward.z,
          z: right.x * forward.y - right.y * forward.x
        };

        return { forward, right, up };
      }

      function cameraProject(wx, wy, wz) {
        const dx = wx - camera.x;
        const dy = wy - camera.y;
        const dz = wz - camera.z;

        const cy = Math.cos(-camera.yaw);
        const sy = Math.sin(-camera.yaw);
        const cp = Math.cos(-camera.pitch);
        const sp = Math.sin(-camera.pitch);

        const xzX = dx * cy - dz * sy;
        const xzZ = dx * sy + dz * cy;

        const yzY = dy * cp - xzZ * sp;
        const yzZ = dy * sp + xzZ * cp;

        if (yzZ <= 0.1) return null;

        const sx = state.halfW + (xzX / yzZ) * state.focalLength;
        const sy2 = state.halfH - (yzY / yzZ) * state.focalLength;

        if (sx < -80 || sx > state.width + 80 || sy2 < -80 || sy2 > state.height + 80) {
          return null;
        }

        return { x: sx, y: sy2, depth: yzZ };
      }

      function drawSkyGradient() {
        const g = ctx.createLinearGradient(0, 0, 0, state.height);
        g.addColorStop(0, '#060d20');
        g.addColorStop(0.55, '#040916');
        g.addColorStop(1, '#02040c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, state.width, state.height);
      }

      function drawFrame(timeSec) {
        drawSkyGradient();

        let starsVisible = 0;
        let nebulasVisible = 0;

        const maxDistSq = MAX_DRAW_DISTANCE * MAX_DRAW_DISTANCE;

        for (const chunk of world.chunks.values()) {
          for (const n of chunk.nebulas) {
            const dx = n.x - camera.x;
            const dy = n.y - camera.y;
            const dz = n.z - camera.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq > maxDistSq * 1.6) continue;

            const p = cameraProject(n.x, n.y, n.z);
            if (!p) continue;

            const radius = Math.max(18, (n.radius / p.depth) * state.focalLength);
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
            grad.addColorStop(0, `rgba(${n.color}, ${n.alpha})`);
            grad.addColorStop(0.7, `rgba(${n.color}, ${n.alpha * 0.22})`);
            grad.addColorStop(1, `rgba(${n.color}, 0)`);

            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.fill();
            nebulasVisible++;
          }
        }

        for (const chunk of world.chunks.values()) {
          for (const s of chunk.stars) {
            const dx = s.x - camera.x;
            const dy = s.y - camera.y;
            const dz = s.z - camera.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq > maxDistSq) continue;

            const p = cameraProject(s.x, s.y, s.z);
            if (!p) continue;

            const twinkle = 0.6 + 0.4 * Math.sin(timeSec * s.twinkleRate + s.twinklePhase);
            const size = Math.max(0.9, (s.size / p.depth) * state.focalLength * 2.8);
            const glow = Math.max(1.8, (s.glow / p.depth) * state.focalLength * 5.4);

            ctx.globalCompositeOperation = 'lighter';
            ctx.shadowBlur = glow;
            ctx.shadowColor = s.color;
            ctx.fillStyle = s.color;
            ctx.globalAlpha = twinkle;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            starsVisible++;
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';

        // subtle crosshair
        ctx.strokeStyle = 'rgba(150, 220, 255, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(state.halfW - 9, state.halfH);
        ctx.lineTo(state.halfW + 9, state.halfH);
        ctx.moveTo(state.halfW, state.halfH - 9);
        ctx.lineTo(state.halfW, state.halfH + 9);
        ctx.stroke();

        starsEl.textContent = starsVisible.toLocaleString();
        nebulasEl.textContent = nebulasVisible.toLocaleString();
        chunksEl.textContent = world.chunks.size.toLocaleString();
      }

      function update(dt) {
        const lookSpeed = 1.15;
        if (keys.has('ArrowLeft')) camera.yaw += lookSpeed * dt;
        if (keys.has('ArrowRight')) camera.yaw -= lookSpeed * dt;
        if (keys.has('ArrowUp')) camera.pitch += lookSpeed * dt;
        if (keys.has('ArrowDown')) camera.pitch -= lookSpeed * dt;

        const maxPitch = Math.PI / 2 - 0.02;
        camera.pitch = Math.max(-maxPitch, Math.min(maxPitch, camera.pitch));

        const { forward, right } = getBasis();
        const speed = SPEED_STEPS[speedIndex].mps;

        let mx = 0, my = 0, mz = 0;

        if (keys.has('w')) {
          mx += forward.x;
          my += forward.y;
          mz += forward.z;
        }
        if (keys.has('s')) {
          mx -= forward.x;
          my -= forward.y;
          mz -= forward.z;
        }
        if (keys.has('a')) {
          mx -= right.x;
          my -= right.y;
          mz -= right.z;
        }
        if (keys.has('d')) {
          mx += right.x;
          my += right.y;
          mz += right.z;
        }

        const len = Math.hypot(mx, my, mz);
        if (len > 0) {
          mx /= len;
          my /= len;
          mz /= len;
          camera.x += mx * speed * dt;
          camera.y += my * speed * dt;
          camera.z += mz * speed * dt;
        }

        updateChunks();
      }

      function setSpeed(index) {
        speedIndex = Math.max(0, Math.min(SPEED_STEPS.length - 1, index));
        speedEl.textContent = SPEED_STEPS[speedIndex].label;
      }

      window.addEventListener('keydown', (e) => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        keys.add(k);

        if (k === 'x') setSpeed(speedIndex + 1);
        if (k === 'z') setSpeed(speedIndex - 1);
        if (k === 'c') setSpeed(0);

        if (
          k === 'ArrowLeft' ||
          k === 'ArrowRight' ||
          k === 'ArrowUp' ||
          k === 'ArrowDown' ||
          k === 'w' ||
          k === 'a' ||
          k === 's' ||
          k === 'd'
        ) {
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', (e) => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        keys.delete(k);
      });

      window.addEventListener('resize', resize);

      resize();
      setSpeed(0);
      updateChunks();

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        update(dt);
        drawFrame(now / 1000);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
