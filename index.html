<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universe Engine: Infinite Drift</title>
  <style>
    :root {
      color-scheme: dark;
      --panel-bg: rgba(8, 14, 30, 0.78);
      --panel-border: rgba(124, 170, 255, 0.35);
      --text: #ddecff;
      --muted: #90a4d6;
      --accent: #95e7ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: auto;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      width: min(410px, calc(100vw - 28px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(9px);
      pointer-events: none;
      user-select: none;
    }

    .hud h1 {
      margin: 0 0 6px;
      font-size: 15px;
      color: var(--accent);
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      font-size: 12px;
      margin: 3px 0;
      color: var(--muted);
    }

    .value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .legend {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.45;
      color: #aec1ee;
    }
  </style>
</head>
<body>
  <canvas id="space"></canvas>

  <div class="hud">
    <h1>Universe Engine</h1>
    <div class="row"><span>Current speed</span><span class="value" id="speed">1.00 m/s</span></div>
    <div class="row"><span>Travel distance</span><span class="value" id="distance">0 m</span></div>
    <div class="row"><span>Loaded sectors</span><span class="value" id="chunks">0</span></div>
    <div class="row"><span>Rendered stars</span><span class="value" id="stars">0</span></div>
    <div class="row"><span>Rendered nebulas</span><span class="value" id="nebulas">0</span></div>
    <div class="legend">
      WASD = 360° movement • Arrow keys = look • Z/X = slower/faster • C = reset speed
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d', { alpha: false });

      const ui = {
        speed: document.getElementById('speed'),
        distance: document.getElementById('distance'),
        chunks: document.getElementById('chunks'),
        stars: document.getElementById('stars'),
        nebulas: document.getElementById('nebulas')
      };

      const keys = new Set();

      // Core simulation values tuned for responsive movement and efficient rendering.
      const CHUNK_SIZE = 3000;
      const LOAD_RADIUS = 2;
      const MAX_DRAW_DIST = CHUNK_SIZE * (LOAD_RADIUS + 1.6);
      const FOV = Math.PI / 3;
      const STAR_BASE_DENSITY = 40;
      const NEBULA_BASE_DENSITY = 2;

      // Exponential speed ladder: starts at 1 m/s and scales up to mega light years / second.
      const SPEED_STEPS = [
        1,
        3,
        10,
        30,
        100,
        300,
        1e3,
        3e3,
        1e4,
        3e4,
        1e5,
        3e5,
        1e6,
        3e6,
        1e7,
        3e7,
        1e8,
        3e8,
        1e9,
        1e10,
        1e11,
        1e12,
        1e13,
        1e14,
        1e15,
        1e16,
        1e17,
        1e18,
        1e19,
        1e20,
        1e21,
        1e22,
        1e23
      ];

      const CONSTANTS = {
        AU: 1.495978707e11,
        LY: 9.4607e15,
        KLY: 9.4607e18,
        MLY: 9.4607e21
      };

      const STAR_TYPES = [
        { color: '#ff8484', size: [0.75, 1.35], glow: [2, 4], twinkle: [0.5, 1.5] },
        { color: '#ffe8a8', size: [0.95, 1.8], glow: [3, 6], twinkle: [0.3, 1.0] },
        { color: '#9fd5ff', size: [1.4, 2.8], glow: [5, 9], twinkle: [0.35, 1.2] },
        { color: '#edf5ff', size: [0.65, 1.25], glow: [2, 4], twinkle: [0.7, 1.8] },
        { color: '#ffc990', size: [1.2, 2.35], glow: [4, 8], twinkle: [0.4, 1.4] },
        { color: '#ccb5ff', size: [0.55, 1.05], glow: [2, 4], twinkle: [0.8, 2.2] },
        { color: '#8ef0ff', size: [0.9, 1.7], glow: [2, 5], twinkle: [0.35, 1.25] }
      ];

      const NEBULA_TYPES = [
        { color: '120,180,255', radius: [240, 620], alpha: [0.03, 0.10] },
        { color: '255,120,220', radius: [210, 540], alpha: [0.03, 0.09] },
        { color: '130,255,180', radius: [250, 640], alpha: [0.03, 0.10] },
        { color: '255,210,120', radius: [220, 560], alpha: [0.02, 0.08] }
      ];

      const camera = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0 };
      const world = { chunks: new Map() };
      const state = { w: 1, h: 1, hw: 0.5, hh: 0.5, focal: 1 };

      let speedIndex = 0;
      let totalTravel = 0;

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function formatSpeed(mps) {
        if (mps >= CONSTANTS.MLY) return `${(mps / CONSTANTS.MLY).toFixed(2)} Mly/s`;
        if (mps >= CONSTANTS.KLY) return `${(mps / CONSTANTS.KLY).toFixed(2)} kly/s`;
        if (mps >= CONSTANTS.LY) return `${(mps / CONSTANTS.LY).toFixed(2)} ly/s`;
        if (mps >= CONSTANTS.AU) return `${(mps / CONSTANTS.AU).toFixed(2)} AU/s`;
        if (mps >= 1e9) return `${(mps / 1e9).toFixed(2)} Gm/s`;
        if (mps >= 1e6) return `${(mps / 1e6).toFixed(2)} Mm/s`;
        if (mps >= 1e3) return `${(mps / 1e3).toFixed(2)} km/s`;
        return `${mps.toFixed(2)} m/s`;
      }

      function formatDistance(meters) {
        if (meters >= CONSTANTS.MLY) return `${(meters / CONSTANTS.MLY).toFixed(3)} Mly`;
        if (meters >= CONSTANTS.KLY) return `${(meters / CONSTANTS.KLY).toFixed(3)} kly`;
        if (meters >= CONSTANTS.LY) return `${(meters / CONSTANTS.LY).toFixed(3)} ly`;
        if (meters >= CONSTANTS.AU) return `${(meters / CONSTANTS.AU).toFixed(3)} AU`;
        if (meters >= 1e9) return `${(meters / 1e9).toFixed(2)} Gm`;
        if (meters >= 1e6) return `${(meters / 1e6).toFixed(2)} Mm`;
        if (meters >= 1e3) return `${(meters / 1e3).toFixed(2)} km`;
        return `${meters.toFixed(1)} m`;
      }

      function hash32(x, y, z) {
        let h = Math.imul(x, 0x8da6b343) ^ Math.imul(y, 0xd8163841) ^ Math.imul(z, 0xcb1ab31f);
        h ^= h >>> 16;
        h = Math.imul(h, 0x7feb352d);
        h ^= h >>> 15;
        h = Math.imul(h, 0x846ca68b);
        h ^= h >>> 16;
        return h >>> 0;
      }

      function createRng(seed) {
        let s = seed >>> 0;
        return () => {
          s += 0x6d2b79f5;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function randomRange(rng, min, max) {
        return min + (max - min) * rng();
      }

      function chunkKey(x, y, z) {
        return `${x},${y},${z}`;
      }

      function ensureChunks() {
        const cx = Math.floor(camera.x / CHUNK_SIZE);
        const cy = Math.floor(camera.y / CHUNK_SIZE);
        const cz = Math.floor(camera.z / CHUNK_SIZE);

        const needed = new Set();
        for (let x = cx - LOAD_RADIUS; x <= cx + LOAD_RADIUS; x++) {
          for (let y = cy - LOAD_RADIUS; y <= cy + LOAD_RADIUS; y++) {
            for (let z = cz - LOAD_RADIUS; z <= cz + LOAD_RADIUS; z++) {
              const key = chunkKey(x, y, z);
              needed.add(key);
              if (!world.chunks.has(key)) {
                world.chunks.set(key, generateChunk(x, y, z));
              }
            }
          }
        }

        for (const key of world.chunks.keys()) {
          if (!needed.has(key)) world.chunks.delete(key);
        }
      }

      function generateChunk(cx, cy, cz) {
        const seed = hash32(cx, cy, cz);
        const rng = createRng(seed);
        const baseX = cx * CHUNK_SIZE;
        const baseY = cy * CHUNK_SIZE;
        const baseZ = cz * CHUNK_SIZE;

        const stars = [];
        const nebulas = [];

        const starCount = STAR_BASE_DENSITY + Math.floor(rng() * STAR_BASE_DENSITY);
        const nebulaCount = NEBULA_BASE_DENSITY + Math.floor(rng() * 3);

        for (let i = 0; i < starCount; i++) {
          const t = STAR_TYPES[Math.floor(rng() * STAR_TYPES.length)];
          stars.push({
            x: baseX + rng() * CHUNK_SIZE,
            y: baseY + rng() * CHUNK_SIZE,
            z: baseZ + rng() * CHUNK_SIZE,
            color: t.color,
            size: randomRange(rng, t.size[0], t.size[1]),
            glow: randomRange(rng, t.glow[0], t.glow[1]),
            twinklePhase: rng() * Math.PI * 2,
            twinkleRate: randomRange(rng, t.twinkle[0], t.twinkle[1])
          });
        }

        for (let i = 0; i < nebulaCount; i++) {
          const n = NEBULA_TYPES[Math.floor(rng() * NEBULA_TYPES.length)];
          nebulas.push({
            x: baseX + rng() * CHUNK_SIZE,
            y: baseY + rng() * CHUNK_SIZE,
            z: baseZ + rng() * CHUNK_SIZE,
            radius: randomRange(rng, n.radius[0], n.radius[1]),
            alpha: randomRange(rng, n.alpha[0], n.alpha[1]),
            color: n.color
          });
        }

        return { stars, nebulas };
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.w = Math.floor(window.innerWidth * dpr);
        state.h = Math.floor(window.innerHeight * dpr);
        state.hw = state.w * 0.5;
        state.hh = state.h * 0.5;
        state.focal = state.hw / Math.tan(FOV * 0.5);

        canvas.width = state.w;
        canvas.height = state.h;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
      }

      function getBasisVectors() {
        const cp = Math.cos(camera.pitch);
        const sp = Math.sin(camera.pitch);
        const cy = Math.cos(camera.yaw);
        const sy = Math.sin(camera.yaw);

        // Right-handed basis.
        const forward = { x: sy * cp, y: sp, z: cy * cp };
        const right = { x: cy, y: 0, z: -sy };
        return { forward, right };
      }

      function projectPoint(wx, wy, wz) {
        const dx = wx - camera.x;
        const dy = wy - camera.y;
        const dz = wz - camera.z;

        const cy = Math.cos(-camera.yaw);
        const sy = Math.sin(-camera.yaw);
        const cp = Math.cos(-camera.pitch);
        const sp = Math.sin(-camera.pitch);

        const x1 = dx * cy - dz * sy;
        const z1 = dx * sy + dz * cy;
        const y2 = dy * cp - z1 * sp;
        const z2 = dy * sp + z1 * cp;

        if (z2 < 0.1) return null;

        const sx = state.hw + (x1 / z2) * state.focal;
        const sy2 = state.hh - (y2 / z2) * state.focal;

        if (sx < -80 || sx > state.w + 80 || sy2 < -80 || sy2 > state.h + 80) return null;

        return { x: sx, y: sy2, depth: z2 };
      }

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, state.h);
        grad.addColorStop(0, '#060f25');
        grad.addColorStop(0.5, '#040917');
        grad.addColorStop(1, '#02040b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, state.w, state.h);
      }

      function draw(timeSec) {
        drawBackground();

        const maxDrawSq = MAX_DRAW_DIST * MAX_DRAW_DIST;
        let visibleStars = 0;
        let visibleNebulas = 0;

        ctx.globalCompositeOperation = 'lighter';

        for (const chunk of world.chunks.values()) {
          for (const n of chunk.nebulas) {
            const dx = n.x - camera.x;
            const dy = n.y - camera.y;
            const dz = n.z - camera.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq > maxDrawSq * 1.9) continue;

            const p = projectPoint(n.x, n.y, n.z);
            if (!p) continue;

            const radius = Math.max(20, (n.radius / p.depth) * state.focal);
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
            g.addColorStop(0, `rgba(${n.color}, ${n.alpha})`);
            g.addColorStop(0.7, `rgba(${n.color}, ${n.alpha * 0.25})`);
            g.addColorStop(1, `rgba(${n.color}, 0)`);

            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.fill();
            visibleNebulas++;
          }
        }

        for (const chunk of world.chunks.values()) {
          for (const s of chunk.stars) {
            const dx = s.x - camera.x;
            const dy = s.y - camera.y;
            const dz = s.z - camera.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq > maxDrawSq) continue;

            const p = projectPoint(s.x, s.y, s.z);
            if (!p) continue;

            const twinkle = 0.65 + 0.35 * Math.sin(timeSec * s.twinkleRate + s.twinklePhase);
            const starSize = Math.max(0.85, (s.size / p.depth) * state.focal * 2.9);
            const glow = Math.max(1.4, (s.glow / p.depth) * state.focal * 5.5);

            ctx.shadowBlur = glow;
            ctx.shadowColor = s.color;
            ctx.globalAlpha = twinkle;
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, starSize, 0, Math.PI * 2);
            ctx.fill();
            visibleStars++;
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';

        // Small center reticle.
        ctx.strokeStyle = 'rgba(158, 223, 255, 0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(state.hw - 8, state.hh);
        ctx.lineTo(state.hw + 8, state.hh);
        ctx.moveTo(state.hw, state.hh - 8);
        ctx.lineTo(state.hw, state.hh + 8);
        ctx.stroke();

        ui.stars.textContent = visibleStars.toLocaleString();
        ui.nebulas.textContent = visibleNebulas.toLocaleString();
        ui.chunks.textContent = world.chunks.size.toLocaleString();
      }

      function setSpeedIndex(index) {
        speedIndex = clamp(index, 0, SPEED_STEPS.length - 1);
        ui.speed.textContent = formatSpeed(SPEED_STEPS[speedIndex]);
      }

      function update(dt) {
        const lookRate = 1.2;
        if (keys.has('ArrowLeft')) camera.yaw += lookRate * dt;
        if (keys.has('ArrowRight')) camera.yaw -= lookRate * dt;
        if (keys.has('ArrowUp')) camera.pitch += lookRate * dt;
        if (keys.has('ArrowDown')) camera.pitch -= lookRate * dt;

        camera.pitch = clamp(camera.pitch, -Math.PI / 2 + 0.02, Math.PI / 2 - 0.02);

        const { forward, right } = getBasisVectors();

        let vx = 0;
        let vy = 0;
        let vz = 0;

        if (keys.has('w')) {
          vx += forward.x;
          vy += forward.y;
          vz += forward.z;
        }
        if (keys.has('s')) {
          vx -= forward.x;
          vy -= forward.y;
          vz -= forward.z;
        }
        if (keys.has('a')) {
          vx -= right.x;
          vz -= right.z;
        }
        if (keys.has('d')) {
          vx += right.x;
          vz += right.z;
        }

        const speed = SPEED_STEPS[speedIndex];
        const length = Math.hypot(vx, vy, vz);

        if (length > 0) {
          vx /= length;
          vy /= length;
          vz /= length;

          const distanceThisFrame = speed * dt;
          camera.x += vx * distanceThisFrame;
          camera.y += vy * distanceThisFrame;
          camera.z += vz * distanceThisFrame;
          totalTravel += distanceThisFrame;
        }

        ui.distance.textContent = formatDistance(totalTravel);

        ensureChunks();
      }

      function isHandledMoveKey(key) {
        return key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown' || key === 'w' || key === 'a' || key === 's' || key === 'd';
      }

      window.addEventListener('keydown', (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.add(key);

        if (key === 'x') setSpeedIndex(speedIndex + 1);
        if (key === 'z') setSpeedIndex(speedIndex - 1);
        if (key === 'c') setSpeedIndex(0);

        if (isHandledMoveKey(key)) event.preventDefault();
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });

      window.addEventListener('resize', resize);

      resize();
      setSpeedIndex(0);
      ensureChunks();

      let previous = performance.now();
      function frame(now) {
        const dt = Math.min((now - previous) / 1000, 0.05);
        previous = now;

        update(dt);
        draw(now / 1000);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
